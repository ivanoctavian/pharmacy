spring:
  application:
    name: Pharmacy

---
# Database config
spring:
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:dev
    driver-class-name: org.h2.Driver
    username: adm
    password: pwd123
    initialization-mode: always
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect

# FDA - external API for medicine check
fda:
  api:
    client:
      medicines:
        search:
          baseurl: https://api.fda.gov
          path: /drug/label.json

---
spring:
  config:
    activate:
      on-profile: dev
    import:
      - pharmacy-dev.yml
---
spring:
  config:
    activate:
      on-profile: int
    import:
      - pharmacy-int.yml
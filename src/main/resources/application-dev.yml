# DEV settings
server:
  port: 8080

# Database config
spring:
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:dev
    driver-class-name: org.h2.Driver
    username: adm
    password: pwd123
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.H2Dialect

# FDA - external API for medicine check
fda:
  api:
    client:
      medicines:
        search:
          baseurl: https://api.fda.gov
          path: /drug/label.json

# EUREKA
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
